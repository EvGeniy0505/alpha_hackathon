services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1
    volumes:
      - credit-data:/app/runtime
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  credit-data:
